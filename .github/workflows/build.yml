name: Build Proteus Native DLL

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Native AOT DLL
        run: dotnet publish Cpu6502Core/Cpu6502Core.csproj -c Release -r win-x64

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cpu6502Core-Native-DLL
          path: Cpu6502Core/bin/Release/net10.0/win-x64/publish/Cpu6502Core.dll